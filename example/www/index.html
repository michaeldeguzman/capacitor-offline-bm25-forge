<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>OfflineBM25 test</title>
    <style>
      body { font: 14px -apple-system, sans-serif; margin: 0; padding: env(safe-area-inset-top) 12px 12px; }
      input { font-size: 16px; width: 70%; }
      button { font-size: 15px; margin: 6px 6px 6px 0; }
      pre { white-space: pre-wrap; word-break: break-word; }
    </style>
  </head>
  <body>
    <h3>OfflineBM25 test</h3>
    <div id="info"></div>
    <button id="index">Index 50 procedures</button>
    <button id="clear">Clear</button>
    <div>
      <input id="query" value="pump seal" autocapitalize="none" />
      <button id="search">Search</button>
    </div>
    <pre id="out"></pre>
    <script>
      window.onerror = (m, src, line) => {
        document.getElementById('out').textContent += `script error | ${m} (${src}:${line})\n`;
      };
    </script>
    <script src="js/capacitor.js"></script>
    <script src="js/plugin.js"></script>
    <script src="js/data.js"></script>
    <script src="js/validate.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
